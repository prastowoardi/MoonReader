name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/moonreader-release.jks
      - name: Build Signed Release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          MOONREADER_KEYSTORE_PATH: keystore/moonreader-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Build Fallback Debug APK (when release secrets not set)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Release Asset (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
